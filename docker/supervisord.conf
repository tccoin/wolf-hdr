; Supervises the processes that make up Wolf. Today that's PulseAudio + Wolf;
; drop in another [program:...] block to add more (e.g. Wolf Den).
;
; Env (PULSE_SERVER, WOLF_EMBED_PULSE, ...) is exported by startup.sh and
; inherited here. Program logs are forwarded to the container's stdout/stderr.

[supervisord]
nodaemon=true
user=root
; nodaemon already mirrors supervisord's own log to the console, so send the
; file copy to /dev/null to avoid duplicate lines in `docker logs`.
logfile=/dev/null
loglevel=info
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; PulseAudio, started before Wolf and restarted if it ever dies at runtime.
; autostart is gated on WOLF_EMBED_PULSE so an external PULSE_SERVER is left alone.
; -n: skip the distro default.pa; auth-anonymous=1: let app containers connect
; without a cookie; exit-idle-time=-1: never shut down on its own.
[program:pulseaudio]
; The Wolf runtime is deliberately launched as root so it can create UHID and
; uinput devices. PulseAudio refuses normal per-user mode as root when the
; shared runtime directory belongs to the app user, so use its explicit system
; mode in that case. The socket is local to the Docker shared runtime and is
; anonymous by design for the app containers.
; The four-channel sink is an audio *endpoint*, not a desktop output.  Wine's
; ScePad implementation exposes one USB DualSense endpoint. WinePulse pairs
; its AUX channels only after WineBus observes active native controller input.
; Keep the quotes inside sink_properties: PulseAudio otherwise parses each
; property as an unrelated module argument and silently declines to create it.
; Pulse can remain alive while its native socket failed to appear (for example
; after a container restart races a stale shared runtime directory).  Treat a
; missing socket as a failed start: supervisor will restart this wrapper and
; Wolf's own socket wait will then only unblock for a usable Pulse instance.
command=bash -ceu 'socket="%(ENV_PULSE_SERVER)s"; rm -f "$socket"; pulseaudio --system -n --daemonize=false --fail=false --exit-idle-time=-1 --disallow-exit --load="module-native-protocol-unix auth-anonymous=1 socket=$socket" -F /etc/pulse/wolf-scepad.pa --log-target=stderr & pa_pid=$!; trap "kill \$pa_pid 2>/dev/null || true; wait \$pa_pid || true; exit 0" INT TERM QUIT; for _ in $(seq 1 50); do [ -S "$socket" ] && { wait "$pa_pid"; exit $?; }; kill -0 "$pa_pid" || { wait "$pa_pid"; exit $?; }; sleep 0.1; done; echo "[pulseaudio] native socket was not created: $socket" >&2; kill "$pa_pid"; wait "$pa_pid" || true; exit 1'
autostart=%(ENV_WOLF_EMBED_PULSE)s
autorestart=true
priority=10
stdout_logfile=NONE
stdout_logfile_maxbytes=0
stderr_logfile=NONE
stderr_logfile_maxbytes=0

; Wolf. When we manage PulseAudio, wait for its socket before starting so Wolf
; connects on the first try (the dependency, expressed without a fixed timeout).
; Higher priority than PulseAudio, so on shutdown supervisord stops Wolf first
; (and waits for it) while PA is still up, letting Wolf tear sessions down with
; audio intact before PA goes away.
[program:wolf]
command=bash -c 'if [ "$WOLF_EMBED_PULSE" = true ]; then echo "[wolf] waiting for PulseAudio socket $PULSE_SERVER"; until [ -S "$PULSE_SERVER" ]; do sleep 0.2; done; fi; exec /wolf/wolf'
autostart=true
autorestart=true
startretries=3
; On stop, send Wolf SIGINT so it stops all sessions/containers gracefully, and
; give it up to stopwaitsecs to finish before supervisord SIGKILLs it. The
; command execs Wolf, so the signal reaches it directly (not a bash wrapper).
stopsignal=INT
stopwaitsecs=30
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
